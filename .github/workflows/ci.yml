name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Measure a real MCP server
        run: |
          node benchmark.mjs memory npx -y @modelcontextprotocol/server-memory > /tmp/memory.json
          node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/memory.json")); if (r.error || !(r.totalTokens > 0)) throw new Error(JSON.stringify(r).slice(0, 300)); console.log(`${r.toolCount} tools, ${r.totalTokens} tokens`)'
